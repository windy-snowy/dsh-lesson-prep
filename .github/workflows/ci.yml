name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx pillow numpy matplotlib lxml

      - name: 语法编译
        run: python -m py_compile scripts/*.py

      - name: 自检与骨架冒烟（无课件路径）
        run: |
          python scripts/lesson_prep.py config
          python scripts/lesson_prep.py all --title "CI 冒烟测试" --out /tmp/ci-run --minutes 90
          python scripts/lesson_prep.py prompts --title "CI 冒烟测试" --run-dir /tmp/ci-run \
            --subagent-mode parallel --slide-mode both --out /tmp/ci-run
          python scripts/verify_pack.py --pack-dir /tmp/ci-run --json | head -40

      - name: 合成课件端到端（裁剪 + 合并 + 打包）
        run: |
          python - <<'PY'
          from pptx import Presentation
          from pptx.util import Inches
          prs = Presentation()
          for i in range(1, 31):
              s = prs.slides.add_slide(prs.slide_layouts[6])
              tb = s.shapes.add_textbox(Inches(1), Inches(1), Inches(8), Inches(3))
              tb.text_frame.text = "%d.%d 小节标题\n第 %d 页正文内容" % (1, (i % 5) + 1, i)
          for i in range(1, 6):
              s = prs.slides.add_slide(prs.slide_layouts[6])
              tb = s.shapes.add_textbox(Inches(1), Inches(1), Inches(8), Inches(3))
              tb.text_frame.text = "def f(x):\n  return x  # 整页代码示例 %d" % i
          prs.save("/tmp/ci-deck.pptx")
          PY
          python scripts/lesson_prep.py all --title "CI 端到端" --deck /tmp/ci-deck.pptx \
            --out /tmp/ci-e2e --minutes 90
          python scripts/lesson_prep.py bundle --pack-dir /tmp/ci-e2e --out /tmp/ci-dist --name "CI 端到端-90分钟备课包"
          python scripts/check_download_page.py --dist-dir /tmp/ci-dist
